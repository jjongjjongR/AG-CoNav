serial_number: a300-00000
version: 0
system:
  hosts:
    - hostname: cpr-a300-00000
      ip: 192.168.131.1
  ros2:
    namespace: wheel
platform:
  battery:
    model: S_24V20_U1
    configuration: S1P2
  attachments:
    - name: front_bumper
      type: a300.bumper
      parent: front_bumper_mount
    - name: rear_bumper
      type: a300.bumper
      parent: rear_bumper_mount
    - name: top_plate
      type: a300.top_plate
  mcu:
    protocol: proton
sensors:
  imu:
    - model: phidgets_spatial
      urdf_enabled: true
      launch_enabled: false
      parent: base_link
      xyz: [0.059, 0.0, 0.161275]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        phidgets_spatial:
          data_interval_ms: 20
  lidar3d:
    - model: ouster_os1
      urdf_enabled: true
      launch_enabled: false
      parent: base_link
      xyz: [0.0, 0.0, 0.5]
      rpy: [0.0, 0.0, 0.0]
      ros_parameters:
        ouster_driver:
          cap_type: halo
          base_type: base
  gps:
    - model: novatel_smart7
      urdf_enabled: true
      launch_enabled: false
      parent: base_link
      xyz: [-0.15, 0.0, 0.45]
      rpy: [0.0, 0.0, 0.0]
