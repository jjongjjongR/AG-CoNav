# AG-CoNav 공통 Nav2 설정 — 모듈 C (지상 Nav2 이동)
#
# README §4 모듈 C 스펙:
#   - 공통 Nav2 설정 하나. 로봇별 차이는 namespace·footprint만.
#   - Voxel Layer로 PointCloud2 직접 (LaserScan 없음).
#   - 입력: /X/nav_map (모듈 F), 위치추정 TF (모듈 B), /X/points.
#   - 출력: /X/cmd_vel.
#
# 현재 use_nav2:=false 기본. 모듈 F의 nav_map과 모듈 B TF가 준비된 후 활성화한다.

amcl:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: $(var namespace)/base_link
    odom_topic: odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    # Nav2 기본 BT xml 사용
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    # cmd_vel 메시지 타입. 여기 값은 자리표시자이며 agconav_sim.launch.py의
    # _nav2_for()가 로봇별로 덮어쓴다(wheel=true, leg=false).
    #   wheel: twist_mux -> diff_drive_controller 체인이 TwistStamped 전용이다
    #          (ros2_controllers Jazzy에서 unstamped 구독이 제거됐다).
    #   leg  : CHAMP quadruped_controller가 geometry_msgs/Twist를 구독한다.
    # 어긋나면 같은 토픽 이름에 타입이 달라 아예 연결되지 않고 로봇이 안 움직인다.
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.3
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: $(var namespace)/odom
      robot_base_frame: $(var namespace)/base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.10
      # README §4: Voxel Layer로 PointCloud2 직접 (LaserScan 없음)
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: points_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      # 전역 지도는 모듈 F가 **한 번만** 주는 /X/nav_map이다.
      # 그래서 갱신도 발행도 자주 할 이유가 없다.
      update_frequency: 0.5
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: $(var namespace)/base_link
      # 정적 맵은 모듈 F의 /X/nav_map으로 제공됨.
      #
      # obstacle_layer는 여기서 뺐다.
      # 그건 10 Hz 실시간 라이다(points_filtered)를 이 격자에 계속 찍는 레이어라,
      # 1회성 지도인 전역 코스트맵(5,010만 칸)을 매 주기 다시 계산하게 만든다.
      # 실시간 장애물은 local_costmap의 voxel_layer가 3x3 m 롤링 창으로 이미 본다 —
      # 이게 Nav2의 원래 역할 분담이다(전역은 정적 지도, 지역은 실시간 센서).
      # 주의: 종단 검증이 막힌 직접 원인은 이게 아니라 아래 map_topic이었다.
      # 이 변경은 5,010만 칸을 계속 갱신하지 않게 하는 예방 차원이고,
      # 성능 효과 자체를 따로 측정하지는 않았다.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        # 반드시 절대 이름으로 준다.
        # 상대 이름 "nav_map"은 코스트맵 노드 자기 네임스페이스에 붙어
        # /wheel/global_costmap/nav_map 이 된다. 모듈 F는 /wheel/nav_map으로
        # 내보내므로 **지도가 한 번도 도달하지 않는다.**
        #   [global_costmap]: Can't update static costmap layer, no map received
        #   [planner_server]: GridBased plugin failed to plan from (0.00, 0.00) ...
        # 시작점이 (0,0)으로 찍히는 것도 지도가 없어 코스트맵이 초기화되지
        # 않은 결과였다. 종단 검증이 여기서 막혔다.
        map_topic: /$(var namespace)/nav_map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # 5,010만 칸이면 전체 발행이 한 번에 50 MB다. 1회성 지도를 주기마다
      # 통째로 다시 보낼 이유가 없으므로 변경분만 보낸다.
      always_send_full_costmap: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false   # _nav2_for()가 로봇별로 덮어쓴다
    local_frame: $(var namespace)/odom
    global_frame: map
    robot_base_frame: $(var namespace)/base_link
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

# collision_monitor는 nav2 lifecycle manager의 관리 대상에 기본 포함되어 있어,
# 설정이 없으면 'observation_sources is not initialized'로 configure에 실패하고
# lifecycle manager가 bringup 전체를 중단한다(코스트맵도 활성화되지 않음).
# 이 프로젝트에는 2D LaserScan이 없으므로 모듈 C의 지면 제거 점군을 쓴다.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false   # _nav2_for()가 로봇별로 덮어쓴다
    base_frame_id: $(var namespace)/base_link
    odom_frame_id: $(var namespace)/odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: points_filtered
      min_height: 0.15
      max_height: 2.0
      enabled: true

# docking_server도 nav2 lifecycle manager의 관리 대상에 하드코딩돼 있다
# (navigation_launch.py의 lifecycle_nodes 리스트). 설정이 없으면
# 'Charging dock plugins not given!'으로 configure에 실패하고, 그 순간
# lifecycle manager가 "Failed to bring up all requested nodes. Aborting bringup."
# 으로 **전체 Nav2 bringup을 중단**한다 — controller/planner/bt_navigator까지
# 통째로 비활성 상태로 남아 navigate_to_pose 액션 자체가 뜨지 않는다.
# AG-CoNav에 충전 도크는 없지만, bringup을 통과시키려면 플러그인이 최소 1개
# 필요하므로 nav2 기본값(simple_charging_dock)을 그대로 둔다. 쓰이지 않는다.
docking_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false   # _nav2_for()가 로봇별로 덮어쓴다
    base_frame: $(var namespace)/base_link
    fixed_frame: $(var namespace)/odom
    controller_frequency: 50.0
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      use_battery_status: false
      use_stall_detection: false
      use_external_detection_pose: false

# velocity_smoother의 기본 odom_topic은 "odom"이라 네임스페이스가 붙으면
# /X/odom을 본다. wheel에는 그 이름의 발행자가 없다(clearpath는
# /wheel/platform/odom). 모듈 B의 융합 결과를 쓰도록 맞춘다.
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false   # _nav2_for()가 로봇별로 덮어쓴다
    odom_topic: odometry/filtered
