# AG-CoNav 공통 Nav2 설정 — 모듈 C (지상 Nav2 이동)
#
# README §4 모듈 C 스펙:
#   - 공통 Nav2 설정 하나. 로봇별 차이는 namespace·footprint만.
#   - Voxel Layer로 PointCloud2 직접 (LaserScan 없음).
#   - 입력: /X/nav_map (모듈 F), 위치추정 TF (모듈 B), /X/points.
#   - 출력: /X/cmd_vel.
#
# 현재 use_nav2:=false 기본. 모듈 F의 nav_map과 모듈 B TF가 준비된 후 활성화한다.

amcl:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: $(var namespace)/base_link
    odom_topic: odometry/filtered
    bt_loop_duration: 10
    # planner_server 가 목표 접수를 응답하기까지 기다리는 시간 [ms].
    # 기본 20 ms 는 코스트맵이 작다는 전제다. 정렬 월드 전체를 0.10 m 격자로
    # 깔면 2,808만 칸이고, 여기에 static_layer + inflation(0.55 m)을 한 번
    # 도는 동안 planner_server 가 통째로 막힌다. 그 사이 들어온 목표는
    # 응답조차 못 받고 이렇게 끝난다(종단 2단계 실측):
    #   Timed out while waiting for action server to acknowledge goal request
    #     for compute_path_to_pose
    #   [navigate_to_pose] [ActionServer] Aborting handle. / Goal failed
    # planner_server 의 costmap_update_timeout(15초)보다 넉넉히 크게 준다.
    # 안 그러면 "경로가 없다"는 진짜 결과 대신 이 시간초과만 보게 된다.
    default_server_timeout: 20000
    # Nav2 기본 BT xml 사용
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

controller_server:
  ros__parameters:
    use_sim_time: true
    # cmd_vel 메시지 타입. 여기 값은 자리표시자이며 agconav_sim.launch.py의
    # _nav2_for()가 로봇별로 덮어쓴다(wheel=true, leg=false).
    #   wheel: twist_mux -> diff_drive_controller 체인이 TwistStamped 전용이다
    #          (ros2_controllers Jazzy에서 unstamped 구독이 제거됐다).
    #   leg  : CHAMP quadruped_controller가 geometry_msgs/Twist를 구독한다.
    # 어긋나면 같은 토픽 이름에 타입이 달라 아예 연결되지 않고 로봇이 안 움직인다.
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: 0.0
      min_vel_y: 0.0
      # 0.3 -> 1.2 m/s. 근거를 전부 실제 상한에서 역산했다.
      #  - A300 하드웨어(config/clearpath_a300/platform/config/control.yaml):
      #    linear.x.max_velocity 2.0, max_acceleration 2.0, max_deceleration -4.0,
      #    angular.z.max_velocity 2.0, max_acceleration 4.0
      #  - Clearpath 자체 텔레옵(clearpath_control/config/a300/teleop_joy.yaml):
      #    평시 0.4, **터보 1.5** m/s -> 제조사가 보는 안전 상한이 1.5다
      #  - DWB 는 sim_time(1.7초)만큼 앞을 시뮬해 궤적을 고른다.
      #    1.2 x 1.7 = 2.04 m 로 voxel_layer 의 obstacle_max_range 2.5 m 안이다.
      #    이 범위를 넘기면 장애물이 안 찍히는 곳까지 궤적을 그려놓고 달리게 된다.
      #  - 정지 거리 v^2/(2a) = 1.2^2/(2*2.0) = 0.36 m
      # 즉 터보의 80%, 하드웨어 상한의 60%. 지역 코스트맵도 3 -> 6 m 로 키웠다
      # (반폭 3 m > 궤적 2.04 m + 로봇 반지름 0.55 m).
      #
      # !! max_speed_xy 도 같이 올려야 한다 !! 이 값이 남아 있으면 병진 속도가
      # 여기서 다시 잘린다. max_vel_x 만 고치는 실수를 하기 쉽다.
      #
      # !! velocity_smoother 도 같이 올려야 한다 !! 그쪽 기본값이
      # max_velocity [0.5, 0.0, 2.0] 이라, 안 고치면 DWB 가 1.2 를 내도
      # 로봇에는 0.5 만 나간다(파일 아래쪽 velocity_smoother 항목 참고).
      max_vel_x: 1.2
      max_vel_y: 0.0
      max_vel_theta: 1.5
      min_speed_xy: 0.0
      max_speed_xy: 1.2
      min_speed_theta: 0.0
      # 2.5 는 하드웨어 max_acceleration(2.0)을 넘는 값이었다. 낼 수 없는 가속을
      # 전제로 궤적을 고르면 실제 거동이 예측과 어긋난다. 실제 값에 맞춘다.
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      # 감속은 하드웨어가 -4.0 까지 되지만 승차감/여유를 위해 -2.5 유지.
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    # 전역 코스트맵이 갱신되기를 이만큼 기다린다(기본 1.0초).
    # 정렬 월드 전체를 0.10 m 격자로 깔면 5785 x 4855 = 2,808만 칸이고,
    # static_layer + inflation(0.55 m = 5.5칸)을 그 위에 한 번 도는 데
    # 1초로는 턱없이 모자랐다. 종단 2단계 실측: 계획 실패 17건 중 10건이
    # "Costmap timed out waiting for update" 였다(나머지 7건은 경로 부재).
    # leg 은 지도 연결성에 문제가 없는데도 이것 때문에 출발하지 못했다.
    # 2,800만 칸 1회성 정적 지도라 여유를 크게 준다.
    costmap_update_timeout: 15.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # false여야 모듈 F의 주행성 판정이 실제로 구속력을 갖는다.
      #
      # true였을 때의 문제: 모듈 F는 셀을 세 가지로 나눠 발행한다 —
      # 통과 가능(0) / 불가(100) / 미지(-1, 드론이 못 본 곳). 실측상 미지가
      # 46~73%를 차지하는데, allow_unknown:true면 NavfnPlanner가 그 미지 칸을
      # 그냥 지나 경로를 만든다. 결과적으로 "주행성 지도를 받긴 받았지만
      # 판정과 무관하게 길이 나오는" 상태가 된다.
      #
      # false로 두면 드론이 실제로 관측하고 "통과 가능"으로 판정한 칸으로만
      # 경로를 낸다. 모듈 F가 실패하면 계획도 실패하므로, 파이프라인이
      # 조용히 잘못된 결과를 내는 대신 그 자리에서 드러난다.
      allow_unknown: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: $(var namespace)/odom
      robot_base_frame: $(var namespace)/base_link
      rolling_window: true
      # 3 x 3 -> 6 x 6 m. 속도를 0.3 -> 1.2 m/s 로 올리면서 같이 키웠다.
      # DWB 는 sim_time 1.7초만큼 앞을 시뮬하므로 1.2 m/s 에서 궤적이 2.04 m
      # 뻗는다. 반폭이 1.5 m 면 궤적 끝이 창 밖으로 나가 그 구간의 장애물
      # 비용을 못 본 채로 궤적을 고르게 된다. 반폭 3 m 면
      # 2.04 m + 로봇 반지름 0.55 m = 2.59 m 를 담는다.
      # voxel_layer 의 obstacle_max_range 2.5 m 와도 맞는 크기다(그보다 더
      # 키워봐야 장애물이 안 찍히므로 계산만 늘어난다).
      # 비용: 900 -> 3,600 칸. 롤링 창이라 부담은 크지 않다.
      width: 6
      height: 6
      resolution: 0.10
      # README §4: Voxel Layer로 PointCloud2 직접 (LaserScan 없음)
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: points_filtered
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      # 전역 지도는 모듈 F가 **한 번만** 주는 /X/nav_map이다.
      # 그래서 갱신도 발행도 자주 할 이유가 없다.
      update_frequency: 0.5
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: $(var namespace)/base_link
      # 정적 맵은 모듈 F의 /X/nav_map으로 제공됨.
      #
      # obstacle_layer는 여기서 뺐다.
      # 그건 10 Hz 실시간 라이다(points_filtered)를 이 격자에 계속 찍는 레이어라,
      # 1회성 지도인 전역 코스트맵(5,010만 칸)을 매 주기 다시 계산하게 만든다.
      # 실시간 장애물은 local_costmap의 voxel_layer가 3x3 m 롤링 창으로 이미 본다 —
      # 이게 Nav2의 원래 역할 분담이다(전역은 정적 지도, 지역은 실시간 센서).
      # 주의: 종단 검증이 막힌 직접 원인은 이게 아니라 아래 map_topic이었다.
      # 이 변경은 5,010만 칸을 계속 갱신하지 않게 하는 예방 차원이고,
      # 성능 효과 자체를 따로 측정하지는 않았다.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        # 반드시 절대 이름으로 준다.
        # 상대 이름 "nav_map"은 코스트맵 노드 자기 네임스페이스에 붙어
        # /wheel/global_costmap/nav_map 이 된다. 모듈 F는 /wheel/nav_map으로
        # 내보내므로 **지도가 한 번도 도달하지 않는다.**
        #   [global_costmap]: Can't update static costmap layer, no map received
        #   [planner_server]: GridBased plugin failed to plan from (0.00, 0.00) ...
        # 시작점이 (0,0)으로 찍히는 것도 지도가 없어 코스트맵이 초기화되지
        # 않은 결과였다. 종단 검증이 여기서 막혔다.
        map_topic: /$(var namespace)/nav_map
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # 5,010만 칸이면 전체 발행이 한 번에 50 MB다. 1회성 지도를 주기마다
      # 통째로 다시 보낼 이유가 없으므로 변경분만 보낸다.
      always_send_full_costmap: false

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false   # _nav2_for()가 로봇별로 덮어쓴다
    local_frame: $(var namespace)/odom
    global_frame: map
    robot_base_frame: $(var namespace)/base_link
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"

# collision_monitor는 nav2 lifecycle manager의 관리 대상에 기본 포함되어 있어,
# 설정이 없으면 'observation_sources is not initialized'로 configure에 실패하고
# lifecycle manager가 bringup 전체를 중단한다(코스트맵도 활성화되지 않음).
# 이 프로젝트에는 2D LaserScan이 없으므로 모듈 C의 지면 제거 점군을 쓴다.
collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false   # _nav2_for()가 로봇별로 덮어쓴다
    base_frame_id: $(var namespace)/base_link
    odom_frame_id: $(var namespace)/odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: points_filtered
      min_height: 0.15
      max_height: 2.0
      enabled: true

# docking_server도 nav2 lifecycle manager의 관리 대상에 하드코딩돼 있다
# (navigation_launch.py의 lifecycle_nodes 리스트). 설정이 없으면
# 'Charging dock plugins not given!'으로 configure에 실패하고, 그 순간
# lifecycle manager가 "Failed to bring up all requested nodes. Aborting bringup."
# 으로 **전체 Nav2 bringup을 중단**한다 — controller/planner/bt_navigator까지
# 통째로 비활성 상태로 남아 navigate_to_pose 액션 자체가 뜨지 않는다.
# AG-CoNav에 충전 도크는 없지만, bringup을 통과시키려면 플러그인이 최소 1개
# 필요하므로 nav2 기본값(simple_charging_dock)을 그대로 둔다. 쓰이지 않는다.
docking_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false   # _nav2_for()가 로봇별로 덮어쓴다
    base_frame: $(var namespace)/base_link
    fixed_frame: $(var namespace)/odom
    controller_frequency: 50.0
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      use_battery_status: false
      use_stall_detection: false
      use_external_detection_pose: false

# velocity_smoother의 기본 odom_topic은 "odom"이라 네임스페이스가 붙으면
# /X/odom을 본다. wheel에는 그 이름의 발행자가 없다(clearpath는
# /wheel/platform/odom). 모듈 B의 융합 결과를 쓰도록 맞춘다.
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false   # _nav2_for()가 로봇별로 덮어쓴다
    odom_topic: odometry/filtered
    # !! 이걸 안 적어두면 Nav2 기본값 max_velocity [0.5, 0.0, 2.0] 이 걸린다 !!
    # 평활기는 controller_server 와 로봇 사이에 있으므로, DWB 에서 1.2 m/s 를
    # 내도 여기서 0.5 로 잘려 로봇에는 0.5 만 나간다. 실제로 이 함정을 만났다
    # (DWB 0.3 일 때는 0.5 아래라 드러나지 않았다).
    # DWB 의 max_vel_x/max_vel_theta 와 같은 값으로 맞춘다.
    # 순서는 [x, y, theta].
    max_velocity: [1.2, 0.0, 1.5]
    min_velocity: [-1.2, 0.0, -1.5]
    # 가속은 A300 하드웨어 값(linear 2.0 / angular 4.0) 이내로 둔다.
    max_accel: [2.0, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
