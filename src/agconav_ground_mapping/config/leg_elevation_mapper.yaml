/**:
  ros__parameters:
    points_topic: points
    elevation_map_topic: elevation_map
    navigation_status_topic: navigation_status
    target_frame: map
    # 변경사항 5: Go2(leg)의 3D LiDAR 전역 TF 프레임 이름. 사설 프레임(os1_lidar)과
    # 전역 프레임(leg/os1_lidar) 이름이 서로 달라, /leg/points의 실제
    # header.frame_id를 실측하지 못한 채로는 안전하게 msg.header.frame_id만
    # 신뢰할 수 없다고 판단해 명시적으로 지정.
    target_source_frame: leg/os1_lidar
    resolution: 0.10
    frame_id: map
    data_timeout_sec: 2.0
    check_period_sec: 1.0

    # ===== 이상치 제거 (2026-08-21 실측 근거, 바꾸지 말 것) =====
    # 기본값 200 m 는 OOM 방지용 상한이었을 뿐 정확도 기준이 아니었다.
    # 지상 로봇의 z 오차는 사거리에 비례해 커진다(자세 오차 x 거리).
    # 실측: 경로에서 0~10 m 구간의 |오차|>3 m 비율 59.8% ->
    #       80~160 m 구간 88.7%. leg 는 -46.4 m 까지 찍혔다.
    # 60 m 로 좁히면 하향 도달 한계가 60*sin(21.2도)=21.7 m 로 줄고,
    # 그 바깥은 어차피 드론 지도(관측 98.9%)가 이미 덮고 있어 손실이 없다.
    max_point_range_m: 60.0
    # 센서보다 12 m 아래 / 60 m 위를 벗어나면 버린다.
    # 아래: 사거리 60 m 안에서 지형이 12 m 이상 꺼질 수 없다(경로 기복 4.3 m).
    # 위:   가장 높은 건물이 80 m 이고 사거리 60 m 라 그 이상은 불가능하다.
    max_z_below_sensor_m: 12.0
    max_z_above_sensor_m: 60.0

