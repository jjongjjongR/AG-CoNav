# 1. IMU 데이터 연결
- ros_topic_name: "imu"
  gz_topic_name: "/imu" # 센서 세팅 완료 후 실제 wheel IMU 토픽 이름으로 수정 필요 (예: /model/wheel/imu)
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# 2. GPS 데이터 연결
- ros_topic_name: "gps/fix"
  gz_topic_name: "/model/wheel/navsat" # 센서 세팅 완료 후 실제 wheel GPS 토픽 이름으로 수정 필요
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS

- ros_topic_name: "odom"
  gz_topic_name: "/model/wheel/odometry" # Gazebo 실제 odom 토픽 이름으로 수정 필요
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS