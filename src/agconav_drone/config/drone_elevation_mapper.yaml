/**:
  ros__parameters:
    points_topic: /drone/points
    elevation_map_topic: /drone/elevation_map
    path_status_topic: /drone/path_status
    target_frame: map
    # model.sdf의 os1_lidar 센서가 gz_frame_id를 이미 "drone/os1_lidar"(전역
    # 이름)로 지정해뒀고 /drone/points의 실측 header.frame_id도 동일하게
    # 찍히는 것을 확인했다 - ground(wheel)와 달리 오버라이드가 필요 없다.
    target_source_frame: ""
    resolution: 0.10
    frame_id: map
    data_timeout_sec: 2.0
    check_period_sec: 1.0
    # 기체 자기 반사 제거(이 브랜치 고유). 드론 자신의 팔/로터를 때린 반사가
    # 센서 좌표계에서 거리 1m 남짓으로 들어오는 것을 걸러낸다.
    min_range_m: 2.5
    # 칼만필터 거리 기반 측정 노이즈(R) 파라미터. 드론도 leg(Go2)와 동일하게
    # 실제 Ouster OS1-32를 장착하므로(README: "센서는 OS1-32로 통일 -- 3대
    # 통일"), leg_elevation_mapper.yaml과 완전히 동일한 값이다 -- placeholder가
    # 아니라 실측 확인된 값이다 (0.3-1m: ±0.7cm, 1-20m: ±1cm, 20-50m: ±2cm,
    # >50m: ±5cm).
    measurement_noise_max_distances: [1.0, 20.0, 50.0, 100.0]
    measurement_noise_sigmas: [0.007, 0.010, 0.020, 0.050]
    incidence_cos_floor: 0.17
    # 1/cos(theta)^exponent. 2.0 = 실물 OS1-32 이론값(기본, 변경 없음).
    # ①(실측 R 보정) 적용 실행에서만 run_results/calibrated_noise_table.md
    # 근거로 0.3으로 덮어쓴다(파라미터 오버라이드 파일 별도, yaml 자체는 미변경).
    measurement_noise_incidence_exponent: 2.0
    # ④ 디스큐(기본 꺼짐, 기존 동작 유지). 켜는 실행에서만 파라미터 오버라이드로
    # true로 바꾼다 -- run_results/PROGRESS.md ④번 절 참고.
    deskew_enabled: false
    deskew_num_buckets: 12
    deskew_scan_period_sec: 0.1
    # bag 재처리 전용 근본 수정(기본 빈 문자열=꺼짐). 켜는 실행에서만 원본
    # bag 경로를 넘겨 노드 시작 시 그 bag의 /tf+/tf_static을 통째로 미리
    # 읽는다 -- run_results/PROGRESS.md ④번 커버리지 손실 수정 절 참고.
    deskew_tf_preload_bag_path: ""
    innovation_gate_threshold: 9.0
    # 1겹 방어: 유한하지만 물리적으로 말이 안 되게 먼 점을 센서 원점 기준
    # 거리로 걸러낸다. Module D(ground_elevation_mapper)와 같은 기본값.
    max_sensor_range: 200.0
    # 2겹 방어: 이상치 하나가 격자를 무한히 키우려 드는 것을 막는 최후
    # 방어선. agconav_map_fusion/grid_math.py가 쓰는 동명 파라미터와 같은
    # 기본값으로 프로젝트 전체에서 일관되게 유지한다.
    max_grid_cells: 30000000
