/**:
  ros__parameters:
    points_topic: /drone/points
    elevation_map_topic: /drone/elevation_map
    path_status_topic: /drone/path_status
    target_frame: map
    # model.sdf의 os1_lidar 센서가 gz_frame_id를 이미 "drone/os1_lidar"(전역
    # 이름)로 지정해뒀고 /drone/points의 실측 header.frame_id도 동일하게
    # 찍히는 것을 확인했다 - ground(wheel)와 달리 오버라이드가 필요 없다.
    target_source_frame: ""
    resolution: 0.10
    frame_id: map
    data_timeout_sec: 2.0
    check_period_sec: 1.0

    # 거리 게이팅. 센서 거리가 이 값을 넘는 반사를 버린다.
    # 근거: `실험2 거리 게이팅.md`. 게이트를 13개 값으로 3차에 걸쳐 훑었고,
    # 115~120 m 가 wheel FN 최저였다(제한없음 10.567% -> 120 m 10.104%,
    # -0.46 %p, 잡음 바닥 0.10 %p 의 4.6배). 비용은 점 1.1% / 커버리지 0.02%.
    #
    # !! 92.5 ~ 100 m 로 내리지 말 것 !! 세 차수 모두 재현되는 열화 구간이다
    # (95 m 에서 +0.85 %p). 이유는 아직 규명하지 못했다.
    #
    # !! 이 값은 고도 84 m 기준이다 !! 게이트가 실제로 정하는 것은 횡방향 도달
    # 거리 sqrt(r^2 - h^2) 이므로 고도가 바뀌면 같이 바꿔야 한다.
    # 84 m 에서 120 m -> 횡방향 89 m. 다른 고도에서 89 m 를 유지하려면
    # max_range = sqrt(h^2 + 89^2).
    # 0 으로 두면 끈다.
    #
    # !! 지금은 거의 아무것도 안 자른다 !! 라이다를 +-45deg 로 좁힌 뒤로는
    # 창 안의 점 중 120 m 를 넘는 것이 0.067% 뿐이다(실측). 120 m 초과 점의
    # 96% 는 이미 방위각 창이 제거한다. 두 필터가 겹친다.
    # 실측 확인: +-45deg 만 vs +-45deg + 게이트 -> wheel FN 7.533 vs 7.529
    # (차이 0.004 %p, 비행 간 잡음 0.74 %p 의 1/200).
    # 그래도 남겨 둔다 -- 창을 다시 넓히거나 고도를 낮추면 그때 살아난다.
    max_range_m: 120.0

    # 방위각 윈도우는 여기서 걸지 않는다 -- 라이다 SDF 자체를 +-45deg /
    # 256 샘플로 좁혔기 때문이다(실기 OS1 의 azimuth_window 에 대응).
    # 여기서 또 걸면 이중 필터가 된다.
    azimuth_min_deg: 0.0
    azimuth_max_deg: 0.0
