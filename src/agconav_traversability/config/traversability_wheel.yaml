# ============================================================
# !! 이 파일의 값은 실측으로 확정됐다. 임의로 바꾸지 말 것 !!
# 바꿔야 한다면 근거가 되는 실험을 다시 돌리고 docs/13 을 갱신할 것.
# 근거: docs/13. 컨트롤러 재실험 — 등판·단차·속도.md
# ============================================================
traversability_verdictor_wheel:
  ros__parameters:
    use_sim_time: true
    features_topic: /terrain/features
    output_map_topic: /wheel/nav_map
    preview_map_topic: /wheel/nav_map_preview
    preview_factor: 8
    status_topic: /wheel/nav_map_status
    # !! 실측값이다. 임의로 올리지 말 것 !!
    # A300 등판 한계: 10도 통과 3/3 / 12도 정지 3/3 (2026-08-20, 명령 0.8 m/s).
    # 20도에서는 진출 3.15 m 로 3회 동일 — 경사 시작점에서 바퀴가 헛돈다.
    # 전복은 한 건도 없다(한계를 넘으면 무너지지 않고 멈춘다).
    # 예전 값 20.0 은 실측의 2배라 못 오르는 11~20도를 "통과 가능"으로
    # 표시했고, 그런 경사가 경로에 들어가면 로봇이 그 자리에서 멈춘다.
    # !! 확정값 10.0. 바꾸지 말 것 !!
    # A300 실측: 10도 통과 3/3 / 12도 정지 3/3 (2026-08-20, 명령 0.8 m/s).
    # 20도에서는 진출 3.15 m 로 3회 동일 — 경사 시작점에서 바퀴가 헛돈다.
    # 전복은 한 건도 없다(한계를 넘으면 무너지지 않고 멈춘다).
    # 예전 값 20.0 은 실측의 2배라 못 오르는 구간을 통과 가능으로 표시했다.
    max_slope_deg: 10.0
    # !! 이 값은 **주행 속도에 딸려 있다** !!
    # 단차 통과는 운동량 문제라 접근 속도가 가른다(2026-08-20 실측):
    #   80 mm  : 명령 0.5 실패 / 0.8 실패 / 1.2 통과 2/2 / 1.6 통과 2/2
    #   100 mm : 0.5, 0.8, 1.2, 1.6 **전부 실패**
    # Nav2 순항이 1.2 이므로 80 mm 가 실제 한계다. 0.08 은 그 값과 일치한다.
    # 문서 12 의 "0.10 으로 올리는 것을 검토" 는 0.8 m/s 한 점만 보고 낸
    # 권고였고, 이번에 속도를 교차해 보니 100 mm 는 어느 속도에서도 못 넘는다.
    # **순항 속도를 1.2 밑으로 내리면 이 값도 같이 내려야 한다.**
    # !! 확정값 0.08. 바꾸지 말 것 !!
    # **이 값은 주행 속도에 딸려 있다.** 단차 통과는 운동량 문제다(실측):
    #   80 mm  : 명령 0.5 실패 / 0.8 실패 / 1.2 통과 2/2 / 1.6 통과 2/2
    #   100 mm : 0.5, 0.8, 1.2, 1.6 **전부 실패**
    # Nav2 순항이 1.2 라 80 mm 가 실제 한계이고 0.08 이 그 값이다.
    # 순항 속도를 1.2 밑으로 내리면 이 값도 같이 내려야 한다.
    max_step_m: 0.08
    unknown_value: -1
    frame_id: map
    # drone, wheel, leg를 처음부터 함께 스폰하면 드론이 wheel 본체를 장애물로
    # 기록한다. A300 외접 반지름(0.547m) + Nav2 inflation(0.55m)보다 조금 크게.
    spawn_clear_x: -195.2127
    spawn_clear_y: 73.0167
    spawn_clear_radius_m: 1.2
