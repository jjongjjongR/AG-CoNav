traversability_verdictor_wheel:
  ros__parameters:
    use_sim_time: true
    features_topic: /terrain/features
    output_map_topic: /wheel/nav_map
    preview_map_topic: /wheel/nav_map_preview
    preview_factor: 8
    status_topic: /wheel/nav_map_status
    max_slope_deg: 20.0   # README §3.3 wheel 통과 기준
    max_step_m: 0.08
    unknown_value: -1
    frame_id: map
    # drone, wheel, leg를 처음부터 함께 스폰하면 드론이 wheel 본체를 장애물로
    # 기록한다. A300 외접 반지름(0.547m) + Nav2 inflation(0.55m)보다 조금 크게.
    spawn_clear_x: -195.2127
    spawn_clear_y: 73.0167
    spawn_clear_radius_m: 1.2
